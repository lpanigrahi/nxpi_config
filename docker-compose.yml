# =============================================================================
# NXPi (Neogen) — SELF-CONTAINED production stack for an Azure Ubuntu VM.
#
# This folder is a standalone deployment package: it has NO dependency on the
# application repository checkout. It is the single-file flatten of the
# repo's proven `docker-compose.yml` + `compose.azure.yml` overlay:
#
#   • the app image is PULLED from the registry (never built on the VM)
#   • Caddy is the only public ingress (80/443); the app port is not published
#   • Postgres (pgvector) + Redis with healthchecks, memory limits, log caps
#   • file-based secrets (./secrets/*) bridged to env by secrets-entrypoint.sh
#   • SOURCELESS database lifecycle: ./install.sh provisions a fresh DB from
#     the static SQL in ./db/<version>/ (schema/grants/seed) via psql inside
#     the postgres container; ./update.sh + ./migrate.sh apply the shipped
#     db/<version>/migrate-*.sql for day-2 schema sync. No git, no app source.
#
# Quick start: run ./install.sh (it pulls images, generates secrets, starts
# the data tier, provisions the DB from ./db/<version>/, and gates on health).
# Day-2: ./update.sh (image + schema), ./migrate.sh (schema only),
# ./backup.sh / ./restore.sh. Manual compose ops: ./compose.sh (honors the
# rollback pin; raw `docker compose` does not).
#
# Requires:
#   ./secrets/*        real secret files (generated by ./install.sh; secrets/README.md)
#   ./.env             Compose interpolation: APP_IMAGE, BETTER_AUTH_URL, …
#   ./.env.app         app runtime env: at least one LLM provider key
#
# Project name is `neogen` on purpose: volume names match the repo-checkout
# stack (`neogen_postgres-data`, …), so this package ADOPTS the data of a VM
# that was previously deployed from the repo overlay.
# =============================================================================
name: neogen

# Per-service log rotation (prevents unbounded disk growth in production).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Baseline hardening — disallow privilege escalation via setuid binaries.
x-security: &security
  - "no-new-privileges:true"

services:
  # ── Data tier ───────────────────────────────────────────────────────────
  postgres:
    # Defaults to the STOCK pgvector image. Point POSTGRES_IMAGE at the
    # pgbackrest-carrying build (docker/nxpi-postgres, published by CI) only
    # when enabling PITR — `archive_command` runs INSIDE this container, so the
    # binary has to be here, not on the host.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    # Tuning for a pgvector workload. HNSW search is pointer-chasing random
    # reads, so the single biggest lever is how much of the graph stays cached —
    # under cgroup v2 the container's memory limit bounds shared_buffers AND the
    # page cache together. Every value is interpolated so ONE file is correct on
    # both the current 8 GB VM and its larger replacement; the defaults below fit
    # 8 GB, and the app repo's `scripts/azure-compose.test.ts` asserts they still do.
    #   maintenance_work_mem — HNSW builds; pgvector NOTICEs when the graph
    #     no longer fits and the build degrades badly.
    #   max_parallel_maintenance_workers — default 2 makes a rebuild crawl.
    #   random_page_cost / effective_io_concurrency — SSD, not spinning media.
    #   autovacuum_vacuum_scale_factor — vector tables bloat the graph faster
    #     than the 20% default assumes.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-384MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_parallel_maintenance_workers=${POSTGRES_PARALLEL_MAINTENANCE:-2}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=zstd
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      # ── WAL archiving (PITR) — OFF by default ──────────────────────────────
      # archive_mode=on with an archive_command that cannot succeed makes
      # Postgres RETAIN every WAL segment until the disk fills and writes stop.
      # Enable only after `./pgbackrest.sh check` proves the repository is
      # reachable, and note that archive_mode changes need a RESTART, not a
      # reload. archive_command goes through pgbackrest rather than a cp: a
      # copy that exits 0 without durably storing the segment lets Postgres
      # recycle WAL that was never shipped — a hole that only surfaces mid-restore.
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_command=pgbackrest --stanza=${PGBACKREST_STANZA:-neogen} archive-push %p
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-60}
    # Parallel HNSW index builds coordinate through /dev/shm, which Docker caps
    # at 64 MB by default. The workers then die at the END of a long rebuild.
    shm_size: 1gb
    environment:
      POSTGRES_USER: neogen_admin
      POSTGRES_DB: neogen
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # initdb creates pg_wal as a symlink to this path, so WAL lands on its own
      # disk without any post-hoc symlink surgery inside PGDATA. Only consulted
      # on a FRESH cluster; an existing one keeps whatever layout it has.
      POSTGRES_INITDB_WALDIR: /srv/pgwal/wal
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mounted at the SAME path inside the container as on the host, so the
      # pg_wal symlink resolves identically in both namespaces. Mounting it
      # elsewhere works for the container but leaves a dangling symlink on the
      # host, breaking any host-side rsync/du.
      - postgres-wal:/srv/pgwal/wal
      # archive_command executes in THIS container, so pgbackrest's config must
      # be here — not merely on the host where ./pgbackrest.sh runs. Read-only:
      # the container archives, it never rewrites its own configuration.
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # NOTE: no cap_drop here on purpose — the official postgres entrypoint
    # needs SETUID/SETGID/CHOWN/FOWNER/DAC_OVERRIDE to drop to the postgres
    # user and own its data dir; trimming caps risks bricking the data tier.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neogen_admin -d neogen"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-512m}

  redis:
    image: redis:7-alpine
    # Build a redis.conf from the mounted secret so the password is NEVER in
    # the redis-server process argv ($$ → $ after compose interpolation), and
    # cap Redis BELOW its 256m cgroup limit: with the default maxmemory=0 the
    # KERNEL OOM-kills redis under queue growth (abrupt failure, possible AOF
    # truncation) instead of Redis erroring gracefully. noeviction is REQUIRED
    # by BullMQ — evicting queue keys corrupts job state.
    # The final exec goes back THROUGH the image's own entrypoint: with
    # $1=redis-server it chowns /data and drops to the unprivileged `redis`
    # user via setpriv — a bare `exec redis-server` here would silently keep
    # redis running as root (the entrypoint only drops for that exact argv).
    # The conf is 0600 and chowned to redis before the drop.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'appendonly yes\ndir /data\nmaxmemory 192mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf
        chown redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256m}

  # ── Cache tier — a SECOND Redis, with the opposite eviction policy ─────────
  # BullMQ requires `noeviction` (evicting a queue key corrupts job state) while
  # a cache needs `allkeys-lru`, because a cache that refuses writes instead of
  # forgetting something takes the queues down with it. Those are mutually
  # exclusive, so sharing one instance means cache growth can fail queue writes.
  #
  # ADDED beside `redis` rather than renaming it: three shell sites hardcode the
  # service name (lib.sh's flush_redis, install.sh and update.sh's wait_healthy)
  # and the live VM's redis-data volume holds in-flight jobs under it. Adding
  # leaves every one of those paths untouched.
  #
  # No persistence and no volume: losing a cache is a cold start, not data loss.
  redis-cache:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'appendonly no\nsave ""\nmaxmemory ${REDIS_CACHE_MAXMEMORY:-192mb}\nmaxmemory-policy allkeys-lru\nrequirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis-cache.conf
        chown redis /tmp/redis-cache.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis-cache.conf
    secrets:
      - redis_password
    networks:
      - backend
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_CACHE_MEM_LIMIT:-256m}

  # ── Application — pulled from the registry, never built on the VM ─────────
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in ./.env to the registry image ref}
    # Map *_FILE secrets → env, then re-exec the image's tini init + CMD.
    # NOTE: overriding `entrypoint` clears the image CMD, so it is restated
    # here; the shim receives it as "$@" and runs `tini -- node server.js`.
    entrypoint: ["sh", "/secrets-entrypoint.sh"]
    command: ["node", "server.js"]
    env_file:
      # LLM provider keys + optional runtime config (see .env.app.example).
      - ./.env.app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NO_HTTPS: "1"
      # BETTER_AUTH_URL alone drives trusted origins/callbacks — the app does
      # NOT read a BETTER_AUTH_TRUSTED_ORIGINS env var (it would be inert).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in ./.env (http://<vm-ip> or https://<domain>)}
      FILE_STORAGE_PREFIX: uploads
      ENABLE_CRON: "true"
      RUN_BACKGROUND_SERVICES: "true"
      # Browser automation (opt-in): the tool connects to the `browser` sidecar
      # over CDP instead of launching Chromium in this (Alpine) image. Empty by
      # default → the feature is inert unless the operator sets ALLOW_BROWSER_
      # AUTOMATION=true (in ./.env.app) AND starts the `browser` profile.
      # NOTE: interpolated from ./.env (set BROWSER_WS_ENDPOINT THERE, next to
      # BROWSER_TOKEN). This `environment:` entry takes precedence over
      # env_file, so a value placed in ./.env.app would be silently overridden
      # by the empty default here.
      BROWSER_WS_ENDPOINT: ${BROWSER_WS_ENDPOINT:-}
      # Never run the boot-time migrator: the image's bundled migration tree is
      # STALE (journal stops early) and would build a partial schema / crash-
      # loop. The schema is owned by the deployment scripts (install.sh /
      # update.sh / migrate.sh applying the static ./db/<version>/ SQL).
      AUTO_DB_MIGRATE: "false"
      # File-based secrets → env, performed by ./secrets-entrypoint.sh:
      POSTGRES_URL_FILE: /run/secrets/postgres_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # Cache tier. Unset in the app image's env => lib/cache falls back
      # to REDIS_URL, i.e. the pre-split single-instance topology.
      REDIS_CACHE_URL_FILE: /run/secrets/redis_cache_url
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
    secrets:
      - postgres_url
      - redis_url
      - redis_cache_url
      - better_auth_secret
    # Plain named volumes for the app's disk paths. On first use Docker
    # populates a fresh volume from the image path — content AND ownership
    # (nextjs:nodejs 1001) — so the non-root app can write immediately.
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
      # npx cache: stdio MCP servers not pre-installed in the image download
      # once per volume lifetime, not per boot.
      - npm-cache-data:/app/.npm-cache
      - ./secrets-entrypoint.sh:/secrets-entrypoint.sh:ro
      # /tmp → tmpfs (ephemeral), sized so the bash sandbox + ad-hoc writes
      # fail with ENOSPC instead of OOMing the container.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 536870912
    # No published ports — Caddy is the only ingress and reaches `app:3000`
    # over the frontend network. No `dns:` pin either — Azure VMs must use the
    # VNet's Azure-provided resolver (hardcoding 8.8.8.8 breaks Private
    # Endpoints / private DNS zones).
    #   `browser` is the isolated egress network shared ONLY with the browser
    #   sidecar (see below) — joining it is harmless when that service is not
    #   running.
    networks:
      - frontend
      - backend
      - browser
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # The app is a non-root (uid 1001) node process on an unprivileged port —
    # it needs no Linux capabilities at all. (read_only rootfs was evaluated
    # and deliberately NOT set: Next.js standalone writes runtime caches under
    # /app and the image pre-creates writable dirs there; the writable surface
    # is already narrowed to the named volumes + the /tmp tmpfs below.)
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}
        reservations:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Headless-browser sidecar (opt-in via `--profile browser`) ────────────────
  # Runs Chromium OUT of the Alpine app image. The app connects over CDP
  # (BROWSER_WS_ENDPOINT=ws://browser:3000?token=…). Attached ONLY to the
  # `browser` network (egress-capable), never to `backend` — so a navigated
  # page can never reach Postgres/Redis. The app's own domain policy also
  # resolves each target and blocks private IPs (defense in depth).
  browser:
    image: ghcr.io/browserless/chromium:latest   # pin a digest in production
    profiles: ["browser"]
    environment:
      # Connection token — MUST be set in ./.env when using `--profile browser`;
      # the app must use the same value in BROWSER_WS_ENDPOINT
      # (ws://browser:3000?token=$BROWSER_TOKEN). Optional here (`:-`) rather than
      # required (`:?`) on purpose: Compose interpolates every service — even
      # inactive-profile ones — so a required guard would break the DEFAULT
      # `docker compose up` for operators who never enable browser automation.
      TOKEN: ${BROWSER_TOKEN:-}
      CONCURRENT: "5"
      TIMEOUT: "60000"
    networks:
      - browser
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Reverse proxy: HTTP on :80 by default; HTTPS (Let's Encrypt) with a domain
  # Deliberately NO depends_on on `app`: caddy answers 502 while the app is
  # starting/updating instead of leaving 80/443 unbound. With a dependency,
  # every app update (`pull` + `up -d`) would also recreate caddy and hold the
  # public ports closed for the whole app boot window (~40s+) — this way an
  # app update really is a single-container rolling restart.
  caddy:
    image: caddy:2-alpine
    environment:
      # Consumed by ./Caddyfile as {$SITE_ADDRESS}. Defaulted HERE (not in the
      # Caddyfile) because Caddy's {$VAR:default} ignores set-but-empty vars.
      #   unset (default)          → ":80" = plain HTTP on the VM IP (IP-only mode)
      #   SITE_ADDRESS=example.com → auto-TLS via Let's Encrypt (set in ./.env)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Custom-certificate mode (optional): consumed by certs/tls.caddy —
      # written by ./generate-certs.sh — as {$TLS_CERT_PATH}/{$TLS_KEY_PATH}.
      # Defaults match the generate-certs.sh output names; override only for
      # differently-named files under ./certs (mounted read-only at /certs).
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/certs/fullchain.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/certs/server.key}
    ports:
      # Host ports are interpolable so the stack can also be smoke-tested on a
      # workstation where 80/443 are taken. On the VM leave them at defaults.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro     # operator-supplied cert/key + tls.caddy snippet
      - caddy-data:/data      # persisted ACME account + issued certificates
      - caddy-config:/config
    networks:
      - frontend              # same network as `app` ⇒ the name `app` resolves
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # Caddy runs as root inside the container but only needs to bind 80/443
    # and write its own /data volume — drop everything else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Probe Caddy's own admin API (binds 127.0.0.1:2019 — use the IPv4 literal;
    # busybox wget resolves `localhost` to ::1 first and gets refused) — proves
    # the config loaded and the process serves, independent of app health.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Database provisioning: SOURCELESS (no clone, no build) ───────────────────
  # There are deliberately NO node/git one-shot services here. The database is
  # provisioned by ./install.sh applying pre-generated static SQL with plain
  # psql inside the `postgres` container:
  #   db/<version>/schema.sql   full DDL (pg_dump --schema-only)
  #   db/<version>/grants.sql   least-privilege neo_gen role + grants
  #   db/<version>/seed.sql     reference seed (admin email + password hash
  #                             injected per-deploy via psql -v)
  # The admin password hash is computed on the target by the public `nxpi-hash`
  # helper image (Better Auth scrypt; no application source). Day-2 schema
  # changes apply db/<version>/migrate-<version>.sql the same way. This is why
  # the deploy target needs NO source, NO drizzle-kit, and NO git access.
  # See docs/SOURCELESS-DEPLOYMENT-PLAN.md.

# ── Internal network split: backend has NO egress (data tier isolated) ──────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  # Isolated egress network for the browser sidecar. NOT `internal` (a browser
  # needs to reach the public web) and deliberately NOT shared with `backend`,
  # so the browser container has no route to the data tier.
  browser:
    driver: bridge

# ── Named volumes ────────────────────────────────────────────────────────────
# Keys match the repo-checkout stack (project `neogen`) so this package adopts
# existing data on a VM that migrated from the overlay deployment.
#
# ── OPT-IN: pinning the stateful volumes to dedicated disks ──────────────────
# The three stateful volumes ship UNPINNED — plain Docker-managed volumes on the
# OS disk, which is what every existing deployment already has. Uncommenting the
# `driver`/`driver_opts` blocks below bind-pins them to dedicated managed disks
# instead (the hardened layout: PGDATA, WAL and the Redis AOF each on their own
# Premium SSD v2). To opt in:
#
#   1. ./prepare-disks.sh          formats, mounts and persists /srv/pgdata,
#                                  /srv/pgwal, /srv/redis (idempotent; --check
#                                  verifies without changing anything)
#   2. uncomment the blocks below
#   3. LIVE deployment? read docs/CUTOVER-RUNBOOK.md FIRST. Docker NEVER
#      re-points an existing volume — it refuses on conflicting options — so
#      this is a copy-verify-recreate, not an edit. ./install.sh reports a
#      `mismatch` verdict and stops rather than letting you converge into it.
#
# Each `device` is a SUBDIRECTORY of its mountpoint, never the mountpoint itself,
# and that is load-bearing: if the disk fails to mount, binding the mountpoint
# hands Postgres an empty directory and it initdbs a brand-new EMPTY cluster —
# the app boots, passes every health check, and serves zero rows. The
# subdirectory exists only ON the disk and Docker's bind driver will not create
# it, so an unmounted disk fails the container start instead. It also sidesteps
# `lost+found`, which would otherwise make a fresh ext4 volume "non-empty".
#
# Mount with UUIDs in fstab and `nofail` — a detached disk must not make the VM
# unbootable. ./prepare-disks.sh does both.
volumes:
  postgres-data:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /srv/pgdata/data
  postgres-wal:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /srv/pgwal/wal
  redis-data:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /srv/redis/data
  uploads-data:
  backups-data:
  npm-cache-data:
  # Caddy's durable state (holds your TLS certs/ACME account — do not lose).
  caddy-data:
  caddy-config:

# ── File-based secrets (generated by ./install.sh; see secrets/README.md) ────
# The app connects as the least-privilege neo_gen role (postgres_url). DDL is
# applied by ./install.sh as the local neogen_admin superuser inside the
# postgres container (no privileged URL / TCP superuser needed).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  postgres_url:
    file: ./secrets/postgres_url
  redis_url:
    file: ./secrets/redis_url
  redis_cache_url:
    file: ./secrets/redis_cache_url
  better_auth_secret:
    file: ./secrets/better_auth_secret
