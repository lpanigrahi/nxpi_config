# =============================================================================
# pgbackrest.conf — repository + stanza configuration for point-in-time
# recovery. Mounted READ-ONLY into the postgres container at
# /etc/pgbackrest/pgbackrest.conf, because `archive_command` runs THERE.
#
# This file is committed so the compose bind always has a real file to mount
# (Docker would otherwise create a stray directory at the host path). It is
# INERT until you enable archiving:
#
#   1. set POSTGRES_IMAGE to the pgbackrest-carrying build in ./.env
#   2. fill in the repo1-azure-* values below
#   3. ./pgbackrest.sh stanza-create   (once)
#   4. ./pgbackrest.sh check           (MUST pass before step 5)
#   5. set POSTGRES_ARCHIVE_MODE=on in ./.env and RESTART postgres
#
# Step 4 is not optional. Turning archive_mode on while the repository is
# unreachable makes Postgres retain every WAL segment until the disk fills and
# the database stops accepting writes.
#
# SECRETS: do NOT put an account key here — this file is committed. Use a
# managed identity, or supply the key at runtime via PGBACKREST_REPO1_AZURE_KEY
# in ./.env (pgbackrest reads PGBACKREST_* env vars, which override this file).
# =============================================================================

[global]
# Azure Blob repository. The container must already exist; give it versioning
# and a time-based immutability policy — a backup a compromised VM can delete
# is not a backup.
repo1-type=azure
repo1-path=/pgbackrest
repo1-azure-account=
repo1-azure-container=
# Managed identity is preferred over a shared key; see pgbackrest.sh --help.
repo1-azure-key-type=auto

# Retention. Full backups are the anchor: expiring a full expires the
# differentials that depend on it, so this is the real recovery window.
repo1-retention-full=4
repo1-retention-full-type=count

# Compression and parallelism. zstd is markedly faster than gzip at equal
# ratios; process-max is bounded so a backup cannot starve the database of CPU
# on a 4-vCPU VM.
compress-type=zst
compress-level=3
process-max=2

# Archive pushes go through a spool so a slow upload does not block the
# checkpointer. async requires archive-get/push to share this path.
archive-async=y
spool-path=/var/spool/pgbackrest

# Verify what was written can be read back. Cheap relative to discovering a
# corrupt repository during an actual restore.
repo1-bundle=y
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[neogen]
# PGDATA as the CONTAINER sees it — pgbackrest runs inside the postgres
# container for archive-push, so this is the container path, not the host's.
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=neogen_admin
pg1-database=neogen
